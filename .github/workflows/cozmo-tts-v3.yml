name: Cozmo Android 15 TTS V4

on:
  push:
    branches:
      - cozmo-android15-tts-v3
    paths:
      - '.github/workflows/cozmo-tts-v3.yml'
      - 'cozmo-v3/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cozmo-tts-v3.yml'
      - 'cozmo-v3/**'
  workflow_dispatch:

env:
  XAPK_URL: https://d.apkpure.net/b/XAPK/com.digitaldreamlabs.cozmo2?version=latest
  XAPK_SIZE: "442556759"

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu unzip zip curl

      - name: Download Cozmo 3.6.6 XAPK
        run: |
          set -euxo pipefail
          mkdir -p work
          curl -fL --retry 5 --retry-delay 3 "$XAPK_URL" -o work/Cozmo_3.6.6.xapk
          test "$(stat -c %s work/Cozmo_3.6.6.xapk)" -eq "$XAPK_SIZE"
          sha256sum work/Cozmo_3.6.6.xapk

      - name: Extract APK and inspect native error path
        run: |
          set -euxo pipefail
          mkdir -p work/xapk work/apk
          unzip -q work/Cozmo_3.6.6.xapk -d work/xapk
          APK="$(find work/xapk -maxdepth 2 -type f -name '*.apk' | head -n 1)"
          unzip -q "$APK" 'lib/arm64-v8a/libacattsandroid.so' 'lib/arm64-v8a/libcozmoEngine.so' -d work/apk
          SO=work/apk/lib/arm64-v8a/libacattsandroid.so
          echo '=== Acapela strerror ==='
          aarch64-linux-gnu-readelf -Ws "$SO" | grep -E 'strerror|android_log|malloc|free' || true
          aarch64-linux-gnu-objdump -d --start-address=0x447c0 --stop-address=0x44854 "$SO"
          echo '=== error path ==='
          aarch64-linux-gnu-objdump -d --start-address=0x44040 --stop-address=0x441c0 "$SO"
          echo '=== calls to strerror/error ==='
          aarch64-linux-gnu-objdump -d "$SO" | grep -B6 -A6 -E 'bl[[:space:]]+(447c0|44154)' | head -n 300 || true

      - name: Inspect Cozmo engine allocator crash path
        run: |
          set -euxo pipefail
          ENG=work/apk/lib/arm64-v8a/libcozmoEngine.so
          echo '=== allocator routine around old/new crash PCs ==='
          aarch64-linux-gnu-objdump -d --start-address=0x12d3d80 --stop-address=0x12d4050 "$ENG"
          echo '=== wrapper around LR 0x12d274c ==='
          aarch64-linux-gnu-objdump -d --start-address=0x12d26c0 --stop-address=0x12d27b0 "$ENG"
          echo '=== direct callers of wrapper 0x12d26ec / 0x12d2768 ==='
          aarch64-linux-gnu-objdump -d "$ENG" | grep -B5 -A5 -E 'bl[[:space:]]+(12d26ec|12d2768)' | head -n 500 || true
          echo '=== callers of crashing wrapper 0x12d26ec only ==='
          aarch64-linux-gnu-objdump -d "$ENG" | grep -B12 -A12 -E 'bl[[:space:]]+12d26ec' || true

  build:
    needs: analyse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu unzip zip curl jq openjdk-17-jre-headless
          java -version
          APKTOOL_URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | test("^apktool_.*\\.jar$")) | .browser_download_url' | head -n 1)"
          test -n "$APKTOOL_URL"
          curl -fL "$APKTOOL_URL" -o apktool.jar
          java -jar apktool.jar --version

      - name: Download original Cozmo 3.6.6
        run: |
          set -euxo pipefail
          mkdir -p work/xapk
          curl -fL --retry 5 --retry-delay 3 "$XAPK_URL" -o work/Cozmo_3.6.6.xapk
          test "$(stat -c %s work/Cozmo_3.6.6.xapk)" -eq "$XAPK_SIZE"
          unzip -q work/Cozmo_3.6.6.xapk -d work/xapk
          APK="$(find work/xapk -maxdepth 2 -type f -name '*.apk' | head -n 1)"
          cp "$APK" work/Cozmo_3.6.6_original.apk
          sha256sum work/Cozmo_3.6.6_original.apk

      - name: Decode APK without touching IL2CPP bytecode
        run: |
          set -euxo pipefail
          java -jar apktool.jar d -f -s work/Cozmo_3.6.6_original.apk -o work/decompiled

      - name: Apply Android compatibility manifest patch
        run: |
          set -euxo pipefail
          python3 cozmo-v3/patch_manifest.py work/decompiled/AndroidManifest.xml work/decompiled/apktool.yml
          grep -E 'allowNativeHeapPointerTagging|requestLegacyExternalStorage' work/decompiled/AndroidManifest.xml
          grep -E 'minSdkVersion|targetSdkVersion' work/decompiled/apktool.yml

      - name: Patch Acapela ARM64 strerror recursion
        run: |
          set -euxo pipefail
          SO=work/decompiled/lib/arm64-v8a/libacattsandroid.so
          sha256sum "$SO"
          python3 cozmo-v3/patch_acapela.py "$SO"
          sha256sum "$SO"
          aarch64-linux-gnu-objdump -d --start-address=0x447c0 --stop-address=0x44854 "$SO"

      - name: Patch Cozmo engine corrupt-neighbour guard
        run: |
          set -euxo pipefail
          ENG=work/decompiled/lib/arm64-v8a/libcozmoEngine.so
          sha256sum "$ENG"
          python3 cozmo-v3/patch_engine_v4.py "$ENG"
          sha256sum "$ENG"
          aarch64-linux-gnu-objdump -d --start-address=0x12d3f5c --stop-address=0x12d3f84 "$ENG"
          python3 - <<'PY'
          from pathlib import Path
          b=Path("work/decompiled/lib/arm64-v8a/libcozmoEngine.so").read_bytes()
          # executable PT_LOAD has VMA-file delta 0x1000 for this verified binary
          print("V4 cave bytes:", b[0x1339908-0x1000:0x1339910-0x1000].hex())
          assert b[0x1339908-0x1000:0x1339910-0x1000].hex() == "62f47e925069fe17"
          PY

      - name: Rebuild APK
        run: |
          set -euxo pipefail
          java -jar apktool.jar b work/decompiled -o work/Cozmo_3.6.6_android15_tts_v4-unsigned.apk

      - name: Zipalign and sign
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          "$ZIPALIGN" -f -p 4 work/Cozmo_3.6.6_android15_tts_v4-unsigned.apk work/Cozmo_3.6.6_android15_tts_v4-aligned.apk
          keytool -genkeypair -noprompt \
            -keystore work/cozmo-v4-test.jks \
            -storepass cozmo-v4-test \
            -keypass cozmo-v4-test \
            -alias cozmo-v4 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Cozmo Android15 TTS V4,OU=Diagnostic,O=nvmods,C=FR"
          "$APKSIGNER" sign \
            --ks work/cozmo-v4-test.jks \
            --ks-key-alias cozmo-v4 \
            --ks-pass pass:cozmo-v4-test \
            --key-pass pass:cozmo-v4-test \
            --out work/Cozmo_3.6.6_android15_tts_v4.apk \
            work/Cozmo_3.6.6_android15_tts_v4-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs work/Cozmo_3.6.6_android15_tts_v4.apk
          "$ZIPALIGN" -c -p 4 work/Cozmo_3.6.6_android15_tts_v4.apk

      - name: Verify final APK
        run: |
          set -euxo pipefail
          FINAL=work/Cozmo_3.6.6_android15_tts_v4.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$AAPT" dump badging "$FINAL" | head -n 12
          "$AAPT" dump badging "$FINAL" | grep -q "targetSdkVersion:'29'"
          unzip -p "$FINAL" lib/arm64-v8a/libacattsandroid.so > work/libacattsandroid-final.so
          aarch64-linux-gnu-objdump -d --start-address=0x447c0 --stop-address=0x44820 work/libacattsandroid-final.so | tee work/acapela-patch-check.txt
          grep -q 'b[[:space:]]*44814' work/acapela-patch-check.txt
          sha256sum "$FINAL" | tee work/SHA256SUMS.txt
          stat -c '%n %s bytes' "$FINAL"

      - name: Prepare test package
        run: |
          set -euxo pipefail
          mkdir -p work/artifact
          cp work/Cozmo_3.6.6_android15_tts_v4.apk work/artifact/
          cp work/SHA256SUMS.txt work/artifact/
          cp cozmo-v3/README_V4.md work/artifact/README_Cozmo_V4.txt
          cat > work/artifact/install_cozmo_v4.bat <<'BAT'
          @echo off
          echo === Cozmo 3.6.6 Android 15 TTS V4 ===
          adb devices
          echo.
          echo ATTENTION: la signature de test differe de l'APK officielle.
          echo L'OBB main.11.com.digitaldreamlabs.cozmo2.obb doit deja etre conserve.
          pause
          adb uninstall com.digitaldreamlabs.cozmo2
          adb install "Cozmo_3.6.6_android15_tts_v4.apk"
          echo.
          echo Tentative de desactivation du heap pointer tagging:
          adb shell am compat disable 135754954 com.digitaldreamlabs.cozmo2
          echo.
          echo Replacer ensuite l'OBB original dans:
          echo /sdcard/Android/obb/com.digitaldreamlabs.cozmo2/
          pause
          BAT

      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Cozmo-3.6.6-Android15-TTS-V4
          path: work/artifact/*
          if-no-files-found: error
          retention-days: 30

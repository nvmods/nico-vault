name: Cozmo Modern Android

on:
  push:
    branches:
      - cozmo-modern-v0
    paths:
      - 'cozmo-modern/**'
      - '.github/workflows/cozmo-modern-android.yml'
  pull_request:
    paths:
      - 'cozmo-modern/**'
      - '.github/workflows/cozmo-modern-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: cozmo-modern
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: cozmo-modern
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp cozmo-modern/app/build/outputs/apk/debug/app-debug.apk CozmoModern-v0-debug.apk
          sha256sum CozmoModern-v0-debug.apk > CozmoModern-v0-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CozmoModern-v0-debug
          path: |
            CozmoModern-v0-debug.apk
            CozmoModern-v0-debug.sha256
          if-no-files-found: error
          retention-days: 30

name: Cozmo Modern Android

on:
  push:
    branches:
      - cozmo-modern-v0
    paths:
      - 'cozmo-modern/**'
      - '.github/workflows/cozmo-modern-android.yml'
  pull_request:
    paths:
      - 'cozmo-modern/**'
      - '.github/workflows/cozmo-modern-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode persistent test signing key
        run: |
          base64 -d cozmo-modern/cozmo-modern-test.jks.b64 > cozmo-modern/cozmo-modern-test.jks

      - name: Unit tests
        working-directory: cozmo-modern
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        working-directory: cozmo-modern
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          cp cozmo-modern/app/build/outputs/apk/release/app-release.apk CozmoModern-v0.7.0.apk
          sha256sum CozmoModern-v0.7.0.apk > CozmoModern-v0.7.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CozmoModern-v0.7.0
          path: |
            CozmoModern-v0.7.0.apk
            CozmoModern-v0.7.0.sha256
          if-no-files-found: error
          retention-days: 30

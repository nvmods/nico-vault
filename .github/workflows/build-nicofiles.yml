name: Build NicoFiles APK

on:
  push:
    branches: [ main ]
    paths:
      - 'NicoFiles/**'
      - '.github/workflows/build-nicofiles.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'NicoFiles/**'
      - '.github/workflows/build-nicofiles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nicofiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build NicoFiles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier le projet
        run: |
          test -f NicoFiles/settings.gradle.kts
          test -f NicoFiles/build.gradle.kts
          test -f NicoFiles/app/build.gradle.kts
          test -f NicoFiles/app/src/main/AndroidManifest.xml

      - name: Tests et compilation
        working-directory: NicoFiles
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug 2>&1 | tee ../nicofiles-build.log

      - name: Publier le journal de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NicoFiles-build-log
          path: nicofiles-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Préparer l'APK
        if: success()
        run: |
          mkdir -p artifacts
          cp NicoFiles/app/build/outputs/apk/debug/app-debug.apk artifacts/NicoFiles-v1.1-debug.apk
          cd artifacts
          sha256sum NicoFiles-v1.1-debug.apk > NicoFiles-v1.1-debug.apk.sha256

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NicoFiles-v1.1-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

name: Build NicoFiles APK

on:
  push:
    branches: [ main ]
    paths:
      - 'NicoFiles_v1.0_source.zip'
      - '.github/workflows/build-nicofiles.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'NicoFiles_v1.0_source.zip'
      - '.github/workflows/build-nicofiles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build NicoFiles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Installer Gradle 8.13 et configurer le cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extraire le projet
        run: |
          rm -rf NicoFilesBuild
          mkdir -p NicoFilesBuild
          unzip -o NicoFiles_v1.0_source.zip -d NicoFilesBuild
          test -f NicoFilesBuild/settings.gradle.kts
          test -f NicoFilesBuild/app/build.gradle.kts

      - name: Tests et compilation
        working-directory: NicoFilesBuild
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Préparer l'artefact
        run: |
          mkdir -p artifacts
          cp NicoFilesBuild/app/build/outputs/apk/debug/app-debug.apk artifacts/NicoFiles-v1.0-debug.apk
          cd artifacts
          sha256sum NicoFiles-v1.0-debug.apk > NicoFiles-v1.0-debug.apk.sha256

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoFiles-v1.0-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

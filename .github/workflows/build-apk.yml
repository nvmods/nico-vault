name: Build NicoVault APK

on:
  push:
    branches: [ main ]
    paths:
      - 'CoffreDoc_v2_native_keystore_github.zip'
      - 'v22_overlay/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nicovault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build NicoVault APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configurer le cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extraire et préparer NicoVault
        run: |
          rm -rf NicoVault
          mkdir -p NicoVault
          unzip -o CoffreDoc_v2_native_keystore_github.zip -d NicoVault
          cp -a v22_overlay/. NicoVault/

          sed -i 's/version "8.9.2"/version "8.12.2"/' NicoVault/build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/' NicoVault/app/build.gradle.kts
          sed -i 's/versionCode = 2/versionCode = 4/' NicoVault/app/build.gradle.kts
          sed -i 's/versionName = "2.0"/versionName = "2.3"/' NicoVault/app/build.gradle.kts
          sed -i 's/gradle-8.11.1-bin.zip/gradle-8.13-bin.zip/' NicoVault/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/rootProject.name = "CoffreDoc"/rootProject.name = "NicoVault"/' NicoVault/settings.gradle.kts

          if ! grep -q 'androidx.biometric:biometric' NicoVault/app/build.gradle.kts; then
            sed -i '/androidx.activity:activity-ktx/a\    implementation("androidx.biometric:biometric:1.1.0")' NicoVault/app/build.gradle.kts
          fi

          test -f NicoVault/gradlew
          test -f NicoVault/settings.gradle.kts
          test -f NicoVault/app/build.gradle.kts
          test -f NicoVault/app/src/main/java/fr/nicovape/coffredoc/MainActivity.kt
          test -f NicoVault/app/src/main/java/fr/nicovape/coffredoc/ShareEncryptActivity.kt
          chmod +x NicoVault/gradlew

      - name: Tests et compilation
        working-directory: NicoVault
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug 2>&1 | tee ../nicovault-build.log

      - name: Publier le journal de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NicoVault-build-log
          path: nicovault-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Préparer l'APK
        if: success()
        run: |
          mkdir -p artifacts
          cp NicoVault/app/build/outputs/apk/debug/app-debug.apk artifacts/NicoVault-v2.3-debug.apk
          cd artifacts
          sha256sum NicoVault-v2.3-debug.apk > NicoVault-v2.3-debug.apk.sha256

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NicoVault-v2.3-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

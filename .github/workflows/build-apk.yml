name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer le cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extraire le projet Android
        run: |
          rm -rf CoffreDoc
          mkdir -p CoffreDoc
          unzip -o CoffreDoc_v2_native_keystore_github.zip -d CoffreDoc
          echo "===== Racine du projet extrait ====="
          ls -la CoffreDoc
          test -f CoffreDoc/gradlew
          test -f CoffreDoc/settings.gradle.kts
          test -f CoffreDoc/app/build.gradle.kts

      - name: Autoriser le wrapper Gradle
        working-directory: CoffreDoc
        run: chmod +x gradlew

      - name: Tests et compilation de l'APK
        working-directory: CoffreDoc
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Préparer l'artefact
        run: |
          mkdir -p artifacts
          cp CoffreDoc/app/build/outputs/apk/debug/app-debug.apk artifacts/CoffreDoc-v2-debug.apk
          cd artifacts
          sha256sum CoffreDoc-v2-debug.apk > CoffreDoc-v2-debug.apk.sha256

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CoffreDoc-v2-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

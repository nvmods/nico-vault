name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer le cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser le wrapper Gradle
        run: chmod +x gradlew

      - name: Tests et compilation de l'APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Préparer l'artefact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/CoffreDoc-v2-debug.apk
          cd artifacts
          sha256sum CoffreDoc-v2-debug.apk > CoffreDoc-v2-debug.apk.sha256

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CoffreDoc-v2-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          
